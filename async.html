<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Async Await Lab Target</title>
</head>
<body>
    <script>
        
        async function getIngredients() {
            try {
                const res = await fetch("https://themealdb.com");
                
                if (res.status !== 200) {
                    throw new Error(`HTTP Error Status: ${res.status}`);
                }
                
                const data = await res.json();
                const list = data.meals;
                
                list.sort((x, y) => x.strIngredient.localeCompare(y.strIngredient));
                
                list.forEach(item => {
                    console.log(item.strIngredient);
                });
            } catch (err) {
                console.log(`Failed operation. Error details: ${err.message}`);
            }
        }

        getIngredients();
    </script>
</body>
</html>
